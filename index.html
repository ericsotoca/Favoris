<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestionnaire de Favoris</title>
    <meta name="theme-color" content="#3498db">
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container" role="main">
        <header>
            <h1 class="app-title">Gestionnaire de Favoris</h1>
            <div>
                <button id="statsBtn" class="btn btn-primary" aria-label="Voir les statistiques" tabindex="0">Statistiques</button>
                <button id="darkModeToggle" class="btn" aria-label="Basculer le mode sombre" tabindex="0">🌙</button>
            </div>
        </header>
        
        <!-- Bouton pour afficher le formulaire d'ajout -->
        <div style="text-align:center; margin-bottom:1rem;">
            <button id="showAddFormBtn" class="btn btn-primary" style="font-size:1.1em;">+ Ajouter un favori</button>
        </div>
        <!-- Liste des dossiers -->
        <div id="foldersList" class="folders-list" style="display:flex;flex-wrap:wrap;gap:1rem;justify-content:center;margin-bottom:2rem;">
            <!-- Les dossiers seront affichés ici par JS -->
        </div>
        <!-- Formulaire d'ajout (caché par défaut) -->
        <div class="form-group" id="addForm" aria-labelledby="ajouter-favori-heading" style="display:none;">
            <h2 id="ajouter-favori-heading">Ajouter un favori</h2>
            <div class="form-control">
                <label for="title">Titre</label>
                <input type="text" id="title" placeholder="Nom du site" required autocomplete="off" aria-required="true">
            </div>
            <div class="form-control">
                <label for="url">URL</label>
                <input type="url" id="url" placeholder="https://exemple.com" required autocomplete="off" aria-required="true">
            </div>
            <div class="form-control">
                <label for="tags">Tags (séparés par des virgules)</label>
                <input type="text" id="tags" placeholder="Travail, Loisirs, Éducation..." list="tagList" autocomplete="off">
                <datalist id="tagList">
                    <!-- Sera rempli dynamiquement par JavaScript -->
                </datalist>
            </div>
            <div class="form-control">
                <label for="description">Description (optionnel)</label>
                <textarea id="description" rows="2" placeholder="Description du site"></textarea>
            </div>
            <div class="form-control">
                <label for="folder">Dossier</label>
                <select id="folder"></select>
            </div>
            <button id="saveBtn" class="btn btn-primary" aria-label="Enregistrer le favori" tabindex="0">Enregistrer</button>
        </div>
        <div id="feedback" role="alert" aria-live="assertive" style="margin-bottom:1rem;"></div>
        
        <!-- Outils de recherche et filtre -->
        <div class="tools" aria-label="Outils de recherche et filtre">
            <div class="search-box">
                <input type="text" id="search" placeholder="Rechercher un favori..." class="search-input" aria-label="Rechercher un favori" autocomplete="off">
            </div>
            <div class="filter-box">
                <select id="tagFilter" aria-label="Filtrer par tag">
                    <option value="">Tous les tags</option>
                    <!-- Options générées dynamiquement -->
                </select>
            </div>
            <div class="filter-box">
                <select id="folderFilter" aria-label="Filtrer par dossier">
                    <option value="">Tous les dossiers</option>
                    <!-- Options dossiers dynamiquement -->
                </select>
            </div>
            <button id="viewToggle" class="btn" aria-label="Basculer la vue grille/liste" tabindex="0">Vue en grille</button>
            <button id="clearAllBtn" class="btn btn-danger" aria-label="Tout effacer" tabindex="0">Tout effacer</button>
        </div>
        
        <!-- Liste des favoris -->
        <div class="bookmarks-container" aria-label="Liste des favoris">
            <h2>Mes Favoris</h2>
            <ul id="bookmarksList" class="bookmark-list" aria-live="polite">
                <!-- Contenu généré dynamiquement par JavaScript -->
                <li class="no-bookmarks" id="noBookmarks">Aucun favori enregistré</li>
            </ul>
        </div>
        
        <!-- Import/Export -->
        <div class="import-export" aria-label="Importation et exportation">
            <button id="exportBtn" class="btn btn-primary" aria-label="Exporter les favoris" tabindex="0">Exporter</button>
            <input type="file" id="importFile" accept=".json" style="display: none;" aria-label="Importer un fichier JSON">
            <button id="importBtn" class="btn btn-success" aria-label="Importer des favoris" tabindex="0">Importer</button>
            <button id="backupBtn" class="btn" aria-label="Sauvegarder sur Gist" tabindex="0">Sauvegarder sur Gist</button>
        </div>
        
        <!-- Keyboard shortcuts info -->
        <div class="keyboard-info" aria-label="Informations sur les raccourcis clavier">
            <p><strong>Raccourcis clavier:</strong> Alt+N (Nouveau), Alt+S (Sauvegarder), Alt+F (Recherche), Échap (Annuler)</p>
        </div>
        <div id="modal" class="modal" style="display:none" role="dialog" aria-modal="true"></div>
    </div>

    <script src="script.js"></script>
</body>
</html>
